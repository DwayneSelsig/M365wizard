version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: saturday
    groups:
      react:
        patterns:
          - "react"
          - "react-dom"
      docusaurus:
        patterns:
          - "@docusaurus/*"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: saturday
